org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# NeoForge 1.20.1 的坐标是 net.neoforged:forge:1.20.1-47.1.x
# （1.20.2 起才改名成 net.neoforged:neoforge，别抄错）
minecraft_version=1.20.1
neo_version=1.20.1-47.1.106
neo_gradle=7.0.192

java_release=17

maven_group=com.trusler.framespike
archives_base_name=FrameSpike-NeoForge

# ★ 网络坑绕过（2026-10-08）：maven.neoforged.net 对本机 Java TLS 栈间歇性 Connection reset
# （Python 直连却通），Gradle 下载/HEAD 常一次挂。加大重试次数 + 缩短重试间隔扛过去。
# 注：TLS 1.2 强制、IPv4、force 固定、cacheDynamicVersionsFor、重命名 metadata 缓存均无效；
# 网络窗口时好时坏（同日早些时候曾直连成功），挂住时换个时段再跑即可。
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=500
