# FrameSpike 多版本构建参数
#
# 默认目标是 1.20.1（Fabric 与 NeoForge 都覆盖、且是 mod 生态最稳的一档）。
# 想换版本就改下面这四个值，然后 `gradle build` 重来一次 —— 代码不用动：
#   1.16.5 -> yarn 1.16.5+build.10 / loader 0.14.21 / fabric-api 0.42.0+1.16.1 / release 8
#   1.21.1 -> yarn 1.21.1+build.3  / loader 0.16.5  / fabric-api 0.115.0+1.21.1
# 注意 fabric-api 的版本号是绑 MC 版本的，抄之前先去 maven.fabricmc.net 确认一下。

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 1.16.5 时要把下面这行改成 8（MC 1.16.5 是 Java 8 字节码）
java_release=17

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

# 版本号由 build.gradle 直接从 ../src/framespike/FrameSpike.java 读，这里不用写
maven_group=com.trusler.framespike
archives_base_name=FrameSpike-Fabric
